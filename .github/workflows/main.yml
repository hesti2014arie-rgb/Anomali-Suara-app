name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # dibutuhkan untuk membuat GitHub Release saat push tag v*
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # URL server multiplayer (opsional). Isi di: Settings > Secrets and variables > Actions > Variables > RTDB_URL
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace "-PrtdbUrl=${{ vars.RTDB_URL }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: anomali suara
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (hanya saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
